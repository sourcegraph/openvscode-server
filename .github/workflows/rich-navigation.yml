name: "Rich Navigation Indexing"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  richnav:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        id: caching-stage
        name: Cache VS Code dependencies
        with:
          path: node_modules
          key: ${{ runner.os }}-dependencies-${{ hashfiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-dependencies-

      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: 14

      - name: Install dependencies
        if: steps.caching-stage.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile
        env:
          CHILD_CONCURRENCY: 1

      - uses: microsoft/RichCodeNavIndexer@c8b97bc908f7bc0151fe4872aa029e99b2a0b96b # v0.1
        with:
          languages: typescript
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          typescriptVersion: 0.6.0-next.19
          configFiles: .lsifrc.json
        continue-on-error: true
